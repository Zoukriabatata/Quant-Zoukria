[project]
name = "quant-mnq-apex"
version = "0.1.0"
description = "Quant systematic trading research — MNQ futures on Apex Trader Funding"
authors = [{name = "BB"}]
requires-python = ">=3.10"
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py314"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | __pycache__
  | node_modules
  | 01_research/outputs
  | 02_validation/v10/reports
  | docs/archive
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "node_modules",
    "01_research/outputs",
    "02_validation/v10/reports",
    "docs/archive",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top (notebook-friendly)
]

[tool.pytest.ini_options]
testpaths = ["01_research/tests", "02_validation/gauntlet/tests", "02_validation/v10/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
